<div class="modal-backdrop" role="presentation" (click)="cancelled.emit()">
  <section class="confirm-dialog" role="dialog" aria-modal="true" [attr.aria-labelledby]="'confirm-dialog-title'" (click)="$event.stopPropagation()">
    <div class="modal-title-row">
      <div class="modal-icon" [ngClass]="config().variant"><mat-icon>{{ config().icon }}</mat-icon></div>
      <h2 id="confirm-dialog-title">{{ config().title }}</h2>
    </div>
    <p [innerHTML]="config().message"></p>
    <footer>
      <button type="button" class="cancel-button" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="confirm-button" [ngClass]="config().variant" (click)="confirmed.emit()">{{ config().confirmLabel }}</button>
    </footer>
  </section>
</div>
