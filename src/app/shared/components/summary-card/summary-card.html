<div class="stat-card rounded-3 border bg-white position-relative p-4 h-100">

    <div class="d-flex flex-column">
        <span class="text-secondary small fw-medium">{{ label() }}</span>
        <span class="fs-3 fw-bold text-custom">{{ formattedValue() }}</span>
    </div>
</div>
